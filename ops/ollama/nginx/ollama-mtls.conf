# mTLS reverse proxy in front of Ollama.
# Requires client certificate signed by certs/mtls/ca.crt.
# Upstream Ollama speaks plain HTTP on the internal Docker network only.

upstream ollama_upstream {
    server ollama:11434;
}

server {
    listen 8443 ssl;
    server_name ollama-proxy;

    ssl_certificate     /certs/mtls/server.crt;
    ssl_certificate_key /certs/mtls/server.key;
    ssl_client_certificate /certs/mtls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # LLM calls can be slow on CPU.
    proxy_connect_timeout 75s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 32m;

    location / {
        proxy_pass http://ollama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
